name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    env:
      PACKAGE_NAME: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        package: [node-red-contrib-debug-file]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
        working-directory: packages/node-red-contrib-debug-file
      - run: node tools/check-source.cjs
      - run: npm test
        working-directory: packages/${{ matrix.package }}
      - run: node --test tools/preflight.test.cjs
      - run: node tools/verify-pack.cjs
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: packages/node-red-contrib-debug-file
      - run: npm audit --audit-level=high
        working-directory: packages/node-red-contrib-debug-file
      - run: npm audit signatures
        working-directory: packages/node-red-contrib-debug-file
  workflow-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash tools/check-security.sh
