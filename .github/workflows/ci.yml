name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '19 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    env:
      PACKAGE_NAME: ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        package: [node-red-contrib-debug-file]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: node tools/check-source.cjs
      - run: npm test
        working-directory: packages/${{ matrix.package }}
      - run: node --test tools/*.test.cjs
      - run: node tools/verify-pack.cjs
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Full development audit (visible monitored report)
        run: node tools/audit.cjs development
      - name: Block actionable development dependencies
        run: node tools/audit.cjs actionable
      - name: Strict production artifact and release tooling audits
        env:
          PACKAGE_NAME: node-red-contrib-debug-file
        run: node tools/audit.cjs release
      - name: Retain complete audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audit-${{ github.job }}
          path: audit-reports/
          if-no-files-found: error
      - run: npm audit signatures
  workflow-and-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: bash tools/check-security.sh
