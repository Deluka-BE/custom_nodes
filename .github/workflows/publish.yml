name: Publish npm (explicit approval)
on:
  workflow_dispatch:
    inputs:
      package:
        description: Registered package
        required: true
        type: choice
        options: [node-red-contrib-debug-file]
      tag:
        description: 'Existing immutable GitHub release tag (PACKAGE/vX.Y.Z)'
        required: true
        type: string
      confirm:
        description: 'Type the exact npm package name to authorize publication'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish-${{ inputs.package }}
  cancel-in-progress: false
jobs:
  validate:
    env:
      PACKAGE_NAME: ${{ inputs.package }}
    if: startsWith(github.ref, format('refs/tags/{0}/v', inputs.package)) && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: packages/${{ inputs.package }}
      - run: bash tools/check-security.sh
      - run: node tools/check-source.cjs
      - run: npm test
        working-directory: packages/${{ inputs.package }}
      - run: node --test tools/preflight.test.cjs
      - run: npm audit --audit-level=high
        working-directory: packages/${{ inputs.package }}
      - run: npm audit signatures
        working-directory: packages/${{ inputs.package }}
      - run: node tools/verify-pack.cjs
  publish:
    env:
      PACKAGE_NAME: ${{ inputs.package }}
    if: vars.NPM_PUBLISH_NODE_RED_CONTRIB_DEBUG_FILE_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-${{ inputs.package }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify approval settings, release identity and immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CONFIRM_PACKAGE: ${{ inputs.confirm }}
          EXPECTED_NPM_OWNER: ${{ vars.NPM_OWNER }}
        run: node tools/prepare-publish.cjs
      - run: node tools/verify-pack.cjs
      - name: Publish once with OIDC and provenance
        # No dependency installation, lifecycle scripts, tokens or retries.
        run: npm publish "$RELEASE_ARCHIVE" --access public --provenance --ignore-scripts --registry=https://registry.npmjs.org
