<script type="text/javascript">
RED.nodes.registerType("debug-file", {
    category: "common", color: "#87a980", inputs: 1, outputs: 0, align: "right",
    icon: "font-awesome/fa-bug", paletteLabel: "debug file",
    defaults: {
        name: { value: "" }, complete: { value: "payload", required: true }, targetType: { value: "msg" },
        tosidebar: { value: true }, console: { value: false }, fileEnabled: { value: true },
        directory: { value: "/share/nodered-logs/", required: true, validate: RED.validators.typedInput({ typeField: "directoryType" }) },
        directoryType: { value: "str" }, createDir: { value: true },
        jsonlMaxValueBytes: { value: 65536, validate: function(v) { return /^\d+$/.test(String(v)) && Number(v) >= 1 && Number(v) <= 1048576; } },
        jsonlRedactValue: { value: false }
    },
    label: function() { return this.name || "Debug " + this.id; },
    onadd: function() { if (!this.name) this.name = "Debug " + this.id; },
    oneditprepare: function() {
        if (!this.name) $("#node-input-name").val("Debug " + this.id);
        $("#node-input-complete").typedInput({ default: "msg", types: ["msg", "jsonata"], typeField: "#node-input-targetType" });
        $("#node-input-directory").typedInput({ default: "str", types: ["str", "msg", "jsonata", "env"], typeField: "#node-input-directoryType" });
    }
});
</script>
<script type="text/html" data-template-name="debug-file">
<div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name" type="text"></div>
<div class="form-row"><label for="node-input-complete">Output</label><input id="node-input-complete" type="text"><input id="node-input-targetType" type="hidden"></div>
<div class="form-row"><label>Debug sidebar</label><input id="node-input-tosidebar" type="checkbox"></div>
<div class="form-row"><label>Runtime log</label><input id="node-input-console" type="checkbox"></div>
<div class="form-row"><label>Write JSONL</label><input id="node-input-fileEnabled" type="checkbox"></div>
<div class="form-row"><label for="node-input-directory">Directory</label><input id="node-input-directory" type="text"><input id="node-input-directoryType" type="hidden"></div>
<div class="form-row"><label>Create directory</label><input id="node-input-createDir" type="checkbox"></div>
<div class="form-row"><label for="node-input-jsonlMaxValueBytes">Value bytes</label><input id="node-input-jsonlMaxValueBytes" type="number" min="1" max="1048576"></div>
<div class="form-row"><label>Omit file value</label><input id="node-input-jsonlRedactValue" type="checkbox"></div>
<div class="form-tips">One UTF-8 JSONL file per node: debug-&lt;SHA-256 of node ID&gt;.log.jsonl. Display renames keep the same file.</div>
</script>
<script type="text/html" data-help-name="debug-file">
<p>Writes one append-only UTF-8 JSONL file per node in /share/nodered-logs/ by default. No plain .log file is created. The node ID determines a stable filename; display names never become paths. No output port.</p>
<p>Select a message property, complete message (true), or JSONata expression. Records include UTC timestamp, node/flow/message IDs, selected property, node name, serializedValue, valueFormat, truncated, redacted and writeResult. Compatible with personal-mcp-gateway v0.2.24.</p>
<p>Values default to 65536 bytes; object traversal is bounded and getters/toJSON are skipped. Buffers use base64. Truncation is explicit. Redaction omits serializedValue; sidebar output is independent. Maximum 128 outstanding events; overflow and I/O failures reach Catch nodes. Failed writes cannot reliably store a failure record.</p>
<p>Linux safe descriptor opening is required. Symlinks, hardlinks and nonregular files are rejected. New files use 0644, new directories 0755; existing file modes only lose permissions. Directory configuration is trusted. Grant MCP read-only access separately; this node never configures MCP permissions. Configure retention upstream; logging is best effort without fsync or rotation.</p>
</script>
