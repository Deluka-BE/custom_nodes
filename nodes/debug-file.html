<script type="text/javascript">
(function () {
    const encodings = [
        "utf8", "ucs2", "utf-16le", "ascii", "binary", "base64", "hex", "utf-16be",
        "Shift_JIS", "Windows-31j", "Windows932", "EUC-JP", "GB2312", "GBK", "GB18030", "Windows936", "EUC-CN",
        "KS_C_5601", "Windows949", "EUC-KR", "Big5", "Big5-HKSCS", "Windows950",
        "cp874", "cp1250", "cp1251", "cp1252", "cp1253", "cp1254", "cp1255", "cp1256", "cp1257", "cp1258",
        "ISO-8859-1", "ISO-8859-2", "ISO-8859-3", "ISO-8859-4", "ISO-8859-5", "ISO-8859-6", "ISO-8859-7", "ISO-8859-8", "ISO-8859-9", "ISO-8859-10", "ISO-8859-11", "ISO-8859-12", "ISO-8859-13", "ISO-8859-14", "ISO-8859-15", "ISO-8859-16",
        "cp437", "cp737", "cp775", "cp808", "cp850", "cp852", "cp855", "cp856", "cp857", "cp858", "cp860", "cp861", "cp866", "cp869", "cp922", "cp1046", "cp1124", "cp1125", "cp1129", "cp1133", "cp1161", "cp1162", "cp1163",
        "maccroatian", "maccyrillic", "macgreek", "maciceland", "macroman", "macromania", "macthai", "macturkish", "macukraine", "maccenteuro", "macintosh",
        "koi8-r", "koi8-u", "koi8-ru", "koi8-t", "armscii8", "rk1048", "tcvn", "georgianacademy", "georgianps", "pt154", "viscii", "iso646cn", "iso646jp", "hproman8", "tis620"
    ];

    RED.nodes.registerType("debug-file", {
        category: "common",
        color: "#87a980",
        defaults: {
            name: { value: "" },
            complete: { value: "payload", required: true },
            targetType: { value: "msg" },
            tosidebar: { value: true },
            console: { value: false },
            fileEnabled: { value: true },
            directory: { value: "", validate: RED.validators.typedInput({ typeField: "directoryType" }) },
            directoryType: { value: "str" },
            appendNewline: { value: true },
            createDir: { value: false },
            overwriteFile: { value: false },
            encoding: { value: "utf8" }
        },
        inputs: 1,
        outputs: 0,
        align: "right",
        icon: "font-awesome/fa-bug",
        paletteLabel: "debug file",
        label: function () { return this.name || (this.targetType === "jsonata" ? "debug file" : "msg." + (this.complete || "payload")); },
        labelStyle: function () { return this.name ? "node_label_italic" : ""; },
        oneditprepare: function () {
            const node = this;
            $("#node-input-complete").typedInput({
                default: "msg",
                types: ["msg", "jsonata"],
                typeField: "#node-input-targetType"
            });
            $("#node-input-directory").typedInput({
                default: "str",
                types: [{ value: "str", label: "path" }, "msg", "jsonata", "env"],
                typeField: "#node-input-directoryType"
            });
            const select = $("#node-input-encoding");
            $("<option>", { value: "none", text: "none (raw Buffer)" }).appendTo(select);
            $("<option>", { value: "setbymsg", text: "set by msg.encoding" }).appendTo(select);
            encodings.forEach(encoding => $("<option>", { value: encoding, text: encoding }).appendTo(select));
            select.val(node.encoding || "utf8");
            $("#node-input-fileEnabled").on("change", function () { $(".debug-file-option").toggle(this.checked); }).trigger("change");
        }
    });
}());
</script>

<script type="text/html" data-template-name="debug-file">
    <div class="form-row">
        <label for="node-input-complete"><i class="fa fa-list"></i> Output</label>
        <input id="node-input-complete" type="text" style="width: 70%">
        <input id="node-input-targetType" type="hidden">
    </div>
    <div class="form-row">
        <label for="node-input-tosidebar"><i class="fa fa-bug"></i> Debug</label>
        <label style="width:70%"><input type="checkbox" id="node-input-tosidebar" style="width:auto"> Show in Debug sidebar</label>
    </div>
    <div class="form-row">
        <label for="node-input-console"></label>
        <label style="width:70%"><input type="checkbox" id="node-input-console" style="width:auto"> Also write to runtime log</label>
    </div>
    <hr>
    <div class="form-row">
        <label for="node-input-fileEnabled"><i class="fa fa-file-text-o"></i> File</label>
        <label style="width:70%"><input type="checkbox" id="node-input-fileEnabled" style="width:auto"> Write to file</label>
    </div>
    <div class="form-row debug-file-option">
        <label for="node-input-directory"><i class="fa fa-folder-open"></i> Path</label>
        <input id="node-input-directory" type="text" style="width:70%">
        <input id="node-input-directoryType" type="hidden">
    </div>
    <div class="form-row debug-file-option">
        <label for="node-input-overwriteFile"><i class="fa fa-random"></i> Action</label>
        <select id="node-input-overwriteFile" style="width:70%"><option value="false">append to file</option><option value="true">overwrite file</option></select>
    </div>
    <div class="form-row debug-file-option">
        <label></label><label style="width:70%"><input type="checkbox" id="node-input-appendNewline" style="width:auto"> Add newline (\n) to each payload</label>
    </div>
    <div class="form-row debug-file-option">
        <label></label><label style="width:70%"><input type="checkbox" id="node-input-createDir" style="width:auto"> Create directory if it doesn't exist</label>
    </div>
    <div class="form-row debug-file-option">
        <label for="node-input-encoding"><i class="fa fa-flag"></i> Encoding</label>
        <select id="node-input-encoding" style="width:70%"></select>
    </div>
    <div class="form-tips debug-file-option">The file is named automatically from the node name, for example <code>Temperature.log</code>. Leave the path blank to use Node-RED's file working directory (or the process directory).</div>
    <div class="form-row"><label for="node-input-name"><i class="fa fa-tag"></i> Name</label><input id="node-input-name" type="text" placeholder="Debug name"></div>
</script>

<script type="text/html" data-help-name="debug-file">
    <p>Displays a selected message value in the Debug sidebar and can write that same value to a file.</p>
    <h3>Details</h3>
    <p>The node has no output, just like the built-in Debug node. Its file name is the node name with <code>.log</code> appended. Characters not permitted in file names are replaced with underscores.</p>
    <p>Objects are written as JSON. Buffers are preserved when the encoding is <code>none</code>. The path supports a fixed value, <code>msg</code>, JSONata and environment variables.</p>
</script>
